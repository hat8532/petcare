# ===================================================================
# PetCare AI Main Backend Application Configuration
# ===================================================================

# 1. Server & Profile Configuration
server.port=8080
server.servlet.context-path=/
spring.profiles.include=dev

# 2. Database & MyBatis Configuration (H2 In-Memory DB & Supabase PostgreSQL Ready)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:petcaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# MyBatis Configuration
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.call-setters-on-nulls=true

# 3. File Upload & Multipart Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===================================================================
# 4. Google Gemini AI API Configuration (RAG & AI Chatbot)
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent

# ===================================================================
# 5. OAuth2 Social Login Provider Infrastructure
# ===================================================================
# 🟡 카카오 OAuth2 기본 인프라
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:dummy-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 🔵 구글 OAuth2 기본 인프라
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# 🟢 네이버 OAuth2 기본 인프라
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:dummy-naver-client-id}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ===================================================================
# 6. External APIs (Naver Map & Naver Search News API)
# ===================================================================
naver.map.client-id=${NAVER_MAP_CLIENT_ID:}
naver.map.client-secret=${NAVER_MAP_CLIENT_SECRET:}

naver.news.client-id=${NAVER_NEWS_CLIENT_ID:}
naver.news.client-secret=${NAVER_NEWS_CLIENT_SECRET:}

# ===================================================================
# 7. JWT Security Configuration
# ===================================================================
jwt.secret=${JWT_SECRET:}


